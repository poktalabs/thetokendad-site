      (() => {
        const root = document.documentElement;
        const btn = document.getElementById('panel-switch');
        if (!btn) return;
        const sync = () => {

            (!root.dataset.theme && !window.matchMedia('(prefers-color-scheme: light)').matches);
          btn.setAttribute('aria-pressed', dark ? 'false' : 'true');
        };
        sync();
        btn.addEventListener('click', () => {
          const dark =
            root.dataset.theme === 'dark' ||
            (!root.dataset.theme && !window.matchMedia('(prefers-color-scheme: light)').matches);
          root.dataset.theme = dark ? 'light' : 'dark';
          try {
            localStorage.setItem('panel-theme', root.dataset.theme);
          } catch {
            /* storage unavailable; the choice lasts for this page only */
          }
          sync();
        });
      })();
